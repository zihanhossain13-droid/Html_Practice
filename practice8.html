<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">
<title>Movie Review Website</title>
  </head>
  <body>
    
    <header><h1>Movie Review</h1></header>
    <nav>
      <a href="#">Home</a>
      <a href="#">Profile</a>
      <a href="#">Movie List</a>
    </nav>
    <main>
    <img src="moviepic.jpg" alt="moviepic">
    <h2>Movie Description</h2>
    <p>This is movie about....</p>
    <h2>Genre</h2>
    <ul>
      <li>Action</li>
      <li>Thriller</li>
      <li>Romantic</li>
    </ul>
    <table>
      <tr>
        <th>Actor</th>
        <th>Role</th>

      </tr>
      <tr>
        <td>A</td>
        <td>Hero</td>
        
      </tr>
      <tr>
        <td>B</td>
        <td>Villain</td>
      </tr>
      <tr>
        <td>C</td>
        <td>Friend</td>
      </tr>
    </table>
    <h2>Review Form</h2>
    <form>
      <label>Name</label>
      <input type="text" placeholder="Enter your name">
      <label>Email</label>
      <input type="email" placeholder="Enter your email">
      <label>Rating</label>
      <select>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
      </select>
      <label>Review</label><br>
      <textarea rows="1" cols="30">Write here</textarea>
    <button type="submit">Submit</button>
    </form>
    </main>
    <footer>
      <p>&copy;2026</p>
    </footer>
  </body>
</html>
