<!DOCTYPE html>
<html>
  <head>
    <style>
    .box{
      width:100px;
      height:100px;
      background-color:red;
      animation:move 2s infinite;

    }
    @keyframes move{
      from{
        transform:translateX(0);
      }
      to{
        transform:translateX(200px);
      }
    }
    </style>

  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
