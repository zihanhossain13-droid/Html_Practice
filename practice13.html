<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">
    <title>Justify Content Practice</title>
  <style>
    .container{
      display:flex;
      flex-direction:row;
      justify-content:center;
      align-items:center;
      height:200px;
      border:2px solid black;
      
    }
    .box{
      width:100px;
      height:100px;
      background-color:orange;
      border:2px solid red;
      margin:5px;
      text-align:center;
    }
  </style>
  </head>
  <body>
    <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>
  </body>
</html>
